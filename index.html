                                        <button onClick={() => setOpenSubPanel(openSubPanel === 'line-color' ? null : 'line-color')} className={`p-2.5 rounded-xl transition-all ${openSubPanel === 'line-color' ? 'text-blue-600 bg-blue-50' : 'text-slate-600 hover:bg-slate-100'}`} title={I18N[lang]?.lineColor}><Palette size={20}/></button>
                                        <button onClick={() => setOpenSubPanel(openSubPanel === 'line-thickness' ? null : 'line-thickness')} className={`p-2.5 rounded-xl transition-all ${openSubPanel === 'line-thickness' ? 'text-blue-600 bg-blue-50' : 'text-slate-600 hover:bg-slate-100'}`} title={I18N[lang]?.lineThickness}><Minus size={20}/></button>
                                        <button onClick={deleteSelected} className="p-2.5 text-rose-500 hover:bg-rose-50 rounded-xl transition-colors" title={I18N[lang]?.deleteEdge}><Trash2 size={20}/></button>
                                    </>
                                )}
                            </div>

                            {/* Zoom Control Panel */}
                            <div ref={zoomPanelRef} className="flex items-center gap-3 p-1.5 px-4 bg-white/80 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-200">
                                <button 
                                    onClick={() => updateActiveSheet({ transform: { ...transform, scale: Math.max(0.01, transform.scale - 0.1) } }, false)}
                                    className="p-1 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all active:scale-90"
                                    title={I18N[lang]?.zoomOut}
                                >
                                    <Minus size={14} />
                                </button>
                                
                                <div className="flex items-center gap-3">
                                    <input 
                                        type="range" 
                                        min="0.01" 
                                        max="3" 
                                        step="0.01" 
                                        value={transform.scale} 
                                        onChange={(e) => updateActiveSheet({ transform: { ...transform, scale: parseFloat(e.target.value) } }, false)}
                                        className="zoom-slider w-28"
                                        title={I18N[lang]?.zoomSlider}
                                    />
                                    <button 
                                        onClick={() => updateActiveSheet({ transform: { ...transform, scale: 1 } }, false)}
                                        className="flex items-center gap-1 px-2 py-1 rounded-lg hover:bg-slate-100 transition-colors"
                                        title={I18N[lang]?.zoomReset}
                                    >
                                        <span className="text-[10px] font-bold text-blue-500 leading-none">{Math.round(transform.scale * 100)}%</span>
                                        <Maximize2 size={10} className="text-slate-300" />
                                    </button>
                                </div>

                                <button 
                                    onClick={() => updateActiveSheet({ transform: { ...transform, scale: Math.min(3, transform.scale + 0.1) } }, false)}
                                    className="p-1 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all active:scale-90"
                                    title={I18N[lang]?.zoomIn}
                                >
                                    <Plus size={14} />
                                </button>
                            </div>
                        </div>

                        {/* EDGE AND GLOBAL SUB-PANELS */}
                        <div className="flex flex-col items-center gap-2 pointer-events-auto" onWheel={(e) => e.stopPropagation()}>
                        
                            {openSubPanel === 'draw' && (
                                <div className="p-3 bg-white rounded-2xl shadow-2xl border border-slate-200 w-80 flex flex-col gap-2 backdrop-blur-sm bg-white/95">
                                    <div className="text-[10px] font-bold text-slate-400 px-1 text-center uppercase">{I18N[lang]?.markerSettings}</div>
                                    <ColorScale color={activeDrawColor} onChange={setActiveDrawColor} lang={lang} />
                                    <div className="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 p-2 gap-3 mt-2">
                                        <span className="text-[10px] font-bold text-slate-500">{I18N[lang]?.thickness}</span>
                                        <input
                                            type="range"
                                            min="1"
                                            max="40"
                                            value={activeDrawWidth}
                                            onChange={(e) => setActiveDrawWidth(Number(e.target.value))}
                                            className="flex-1 accent-blue-600 h-1"
                                        />
                                        <div className="flex items-center gap-1 rounded-lg bg-white border border-slate-200 px-1.5 py-1 shrink-0">
                                            <input
                                                type="text"
                                                inputMode="numeric"
                                                pattern="[0-9]*"
                                                value={activeDrawWidth}
                                                onChange={(e) => setActiveDrawWidth(Math.max(1, Math.min(100, Number(e.target.value) || 1)))}
                                                className="w-7 bg-transparent text-right text-[11px] font-bold text-slate-700 outline-none"
                                            />
                                            <span className="text-[9px] text-slate-400">px</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {openSubPanel === 'font' && !selectedNode && (
                                <div className="p-3 bg-white rounded-2xl shadow-2xl border border-slate-200 w-80 flex flex-col gap-2 backdrop-blur-sm bg-white/95">
                                    <div className="text-[10px] font-bold text-slate-400 px-1 text-center uppercase">{I18N[lang]?.defaultFontNewBlocks}</div>
                                    
                                    <div className="flex bg-slate-100 p-1 rounded-xl text-[11px] font-bold">
                                        <button onClick={() => { setFontTab('title'); setFontTarget('title'); }} className={`flex-1 py-1.5 rounded-lg transition-all ${fontTab === 'title' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.tabTitle}</button>
                                        <button onClick={() => { setFontTab('text'); setFontTarget('text'); }} className={`flex-1 py-1.5 rounded-lg transition-all ${fontTab === 'text' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.tabText}</button>
                                        <button onClick={() => setFontTab('fonts')} className={`flex-1 py-1.5 rounded-lg transition-all ${fontTab === 'fonts' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.tabFonts}</button>
                                    </div>
                                    
                                    {(fontTab === 'title' || fontTab === 'text') && (
                                        <div className="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 p-2 gap-3">
                                        <span className="text-[10px] font-bold text-slate-500">{I18N[lang]?.size}</span>
                                        <input
                                            type="range"
                                            min={MIN_FONT_SIZE}
                                            max={MAX_FONT_SIZE}
                                            value={fontTarget === 'title' ? (activeSheet.defaultTitleFontSize || DEFAULT_TITLE_FONT_SIZE) : (activeSheet.defaultTextFontSize || DEFAULT_TEXT_FONT_SIZE)}
                                            onChange={(e) => {
                                                const size = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, Number(e.target.value) || MIN_FONT_SIZE));
                                                updateActiveSheet(fontTarget === 'title' ? { defaultTitleFontSize: size } : { defaultTextFontSize: size });
                                            }}
                                            className="flex-1 accent-blue-600 h-1"
                                        />
                                        <div className="flex items-center gap-1 rounded-lg bg-white border border-slate-200 px-1.5 py-1 shrink-0">
                                            <input
                                                type="text"
                                                inputMode="numeric"
                                                pattern="[0-9]*"
                                                value={fontTarget === 'title' ? (activeSheet.defaultTitleFontSize || DEFAULT_TITLE_FONT_SIZE) : (activeSheet.defaultTextFontSize || DEFAULT_TEXT_FONT_SIZE)}
                                                onChange={(e) => {
                                                    const size = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, Number(e.target.value) || MIN_FONT_SIZE));
                                                    updateActiveSheet(fontTarget === 'title' ? { defaultTitleFontSize: size } : { defaultTextFontSize: size });
                                                }}
                                                className="w-7 bg-transparent text-right text-[11px] font-bold text-slate-700 outline-none"
                                            />
                                            <span className="text-[9px] text-slate-400">px</span>
                                        </div>
                                    </div>
                                    )}

                                    {fontTab === 'fonts' && (
                                        <div className="flex flex-col gap-2 mt-1">
                                            <div className="flex bg-slate-200 p-0.5 rounded-lg text-[9px] font-bold mx-1">
                                                <button onClick={() => setFontTarget('title')} className={`flex-1 py-1 rounded-md transition-all ${fontTarget === 'title' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.subTabForTitle}</button>
                                                <button onClick={() => setFontTarget('text')} className={`flex-1 py-1 rounded-md transition-all ${fontTarget === 'text' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.subTabForText}</button>
                                            </div>
                                            <div className="max-h-72 overflow-y-auto custom-scrollbar flex flex-col gap-1 pr-1">
                                                {FONT_OPTIONS.map(f => {
                                                    const currentVal = fontTarget === 'title'
                                                        ? (activeSheet.defaultTitleFontFamily || activeSheet.defaultFontFamily || '"Inter", sans-serif')
                                                        : (activeSheet.defaultTextFontFamily || activeSheet.defaultFontFamily || '"Inter", sans-serif');
                                                    const isSelected = currentVal === f.value;
                                                    return (
                                                        <button 
                                                            key={f.value} 
                                                            onClick={() => updateActiveSheet(fontTarget === 'title' ? { defaultTitleFontFamily: f.value } : { defaultTextFontFamily: f.value })}
                                                            className={`w-full text-left px-3 py-2.5 hover:bg-slate-50 rounded-xl text-sm flex justify-between items-center transition-colors ${isSelected ? 'bg-blue-50 text-blue-600 font-medium ring-1 ring-blue-500' : 'text-slate-700'}`} 
                                                            style={{ fontFamily: f.value }}
                                                        >
                                                            {f.name} <span className="text-[10px] text-slate-400">Aa</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {openSubPanel === 'arrow-type' && (
                                <div className="p-3 bg-white rounded-2xl shadow-2xl border border-slate-200 backdrop-blur-sm bg-white/95">
                                    <div className="flex gap-2">
                                        {ARROW_TYPES.map(type => (
                                            <button
                                                key={type.id}
                                                onClick={() => { if(selectedEdge) changeEdgeProperty('arrowType', type.id); }}
                                                className={`flex flex-col items-center gap-1 p-3 rounded-xl transition-all min-w-[70px] ${(selectedEdge && selectedEdge.arrowType === type.id) ? 'bg-blue-600 text-white' : 'hover:bg-slate-100 text-slate-600'} ${!selectedEdge ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                disabled={!selectedEdge}
                                                title={type.name}
                                            >
                                                <ArrowIcon type={type.id} className={(selectedEdge && selectedEdge.arrowType === type.id) ? 'text-white' : 'text-slate-600'} />
                                                <span className="text-[10px] font-medium">{I18N[lang]?.[type.nameKey] || type.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {openSubPanel === 'line-color' && (
                                <div className="flex flex-col gap-2 p-3 bg-white rounded-2xl shadow-2xl border border-slate-200 backdrop-blur-sm bg-white/95 w-64">
                                    <div className="grid grid-cols-6 gap-1.5">
                                        {COLORS.map(c => c.value !== 'transparent' && <button key={c.value} onClick={() => { if(selectedEdge) changeEdgeProperty('color', c.value); }} className={`w-7 h-7 rounded-full border border-slate-300 hover:scale-110 transition-transform shadow-sm ${(selectedEdge && selectedEdge.color === c.value) ? 'ring-2 ring-blue-500 ring-offset-1' : ''} ${!selectedEdge ? 'opacity-50 cursor-not-allowed' : ''}`} style={{ backgroundColor: c.value }} disabled={!selectedEdge} title={selectedEdge ? "Цвет линии" : "Сначала выберите линию"} />)}
                                    </div>
                                    <ColorScale color={selectedEdge?.color} onChange={(val) => { if(selectedEdge) changeEdgeProperty('color', val); }} disabled={!selectedEdge} lang={lang} />
                                </div>
                            )}

                            {openSubPanel === 'line-thickness' && (
                                <div className="grid grid-cols-5 gap-1 p-3 bg-white rounded-2xl shadow-2xl border border-slate-200 backdrop-blur-sm bg-white/95">
                                    {THICKNESS_OPTIONS.map(t => <button key={t} onClick={() => { if(selectedEdge) changeEdgeProperty('strokeWidth', t); }} className={`px-3 py-2 text-[10px] font-bold rounded-lg border transition-all ${(selectedEdge && selectedEdge.strokeWidth === t) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'} ${!selectedEdge ? 'opacity-50 cursor-not-allowed' : ''}`} disabled={!selectedEdge} title={selectedEdge ? "Толщина линии" : "Сначала выберите линию"}>{t}px</button>)}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* NODE SUB-PANELS (Contextual) */}
                    {selectedNode && openSubPanel && ['shape', 'font', 'fill', 'stroke'].includes(openSubPanel) && (
                        <div 
                            className="absolute z-[350] pointer-events-auto context-subpanel"
                            style={{
                                left: (selectedNode.x + selectedNode.width) * transform.scale + transform.x + 20,
                                top: selectedNode.y * transform.scale + transform.y
                            }}
                            onWheel={(e) => e.stopPropagation()}
                        >
                            {openSubPanel === 'shape' && (
                                <div className="flex flex-col gap-2 p-2 bg-white rounded-2xl shadow-2xl border border-slate-200 backdrop-blur-sm bg-white/95">
                                    {['rect', 'circle', 'triangle', 'diamond'].map(s => (
                                        <button key={s} onClick={() => { if(selectedNode) changeNodeProperty('shape', s); setOpenSubPanel(null); }} className={`p-3 rounded-xl transition-all ${(selectedNode && selectedNode.shape === s) ? 'bg-blue-600 text-white' : 'hover:bg-slate-100 text-slate-600'}`} title={`Форма: ${s}`}>
                                            {s === 'rect' ? <Square size={20}/> : s === 'circle' ? <Circle size={20}/> : s === 'triangle' ? <Triangle size={20}/> : <Diamond size={20}/>}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {openSubPanel === 'font' && (
                                <div className="p-3 bg-white rounded-2xl shadow-2xl border border-slate-200 w-80 flex flex-col gap-2 backdrop-blur-sm bg-white/95">
                                    <div className="flex bg-slate-100 p-1 rounded-xl text-[11px] font-bold">
                                        {selectedNode?.shape !== 'text' && selectedNode?.hasTitle !== false && (
                                            <button onClick={() => { setFontTab('title'); setFontTarget('title'); }} className={`flex-1 py-1.5 rounded-lg transition-all ${fontTab === 'title' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.tabTitle}</button>
                                        )}
                                        <button onClick={() => { setFontTab('text'); setFontTarget('text'); }} className={`flex-1 py-1.5 rounded-lg transition-all ${fontTab === 'text' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.tabText}</button>
                                        <button onClick={() => setFontTab('fonts')} className={`flex-1 py-1.5 rounded-lg transition-all ${fontTab === 'fonts' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.tabFonts}</button>
                                    </div>

                                    {(fontTab === 'title' || fontTab === 'text') && (
                                        <>
                                            <div className="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 p-2 gap-3">
                                        <span className="text-[10px] font-bold text-slate-500">{I18N[lang]?.size}</span>
                                        <input
                                            type="range"
                                            min={MIN_FONT_SIZE}
                                            max={MAX_FONT_SIZE}
                                            value={activeFontSize}
                                            onChange={(e) => setActiveFontSize(e.target.value)}
                                            className="flex-1 accent-blue-600 h-1"
                                        />
                                        <div className="flex items-center gap-1 rounded-lg bg-white border border-slate-200 px-1.5 py-1 shrink-0">
                                            <input
                                                type="text"
                                                inputMode="numeric"
                                                pattern="[0-9]*"
                                                value={activeFontSize}
                                                onChange={(e) => setActiveFontSize(e.target.value)}
                                                className="w-7 bg-transparent text-right text-[11px] font-bold text-slate-700 outline-none"
                                            />
                                            <span className="text-[9px] text-slate-400">px</span>
                                        </div>
                                    </div>

                                    <div className="flex gap-1.5 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                                        <button 
                                            onClick={(e) => { e.preventDefault(); setActiveFormatter(prev => prev === 'bold' ? null : 'bold'); setActiveMarkerColor(null); setActiveTextColor(null); }}
                                            className={`flex-1 py-1 rounded-lg border font-bold hover:shadow-sm transition-colors text-slate-700 ${activeFormatter === 'bold' ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-transparent bg-transparent hover:bg-white hover:border-slate-300'}`}
                                            title={I18N[lang]?.brushBold}
                                        >{lang === "en" ? "B" : "Ж"}</button>
                                        <button 
                                            onClick={(e) => { e.preventDefault(); setActiveFormatter(prev => prev === 'italic' ? null : 'italic'); setActiveMarkerColor(null); setActiveTextColor(null); }}
                                            className={`flex-1 py-1 rounded-lg border italic hover:shadow-sm transition-colors text-slate-700 ${activeFormatter === 'italic' ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-transparent bg-transparent hover:bg-white hover:border-slate-300'}`}
                                            title={I18N[lang]?.brushItalic}
                                        >{lang === "en" ? "I" : "К"}</button>
                                        <button 
                                            onClick={(e) => { e.preventDefault(); setActiveFormatter(prev => prev === 'underline' ? null : 'underline'); setActiveMarkerColor(null); setActiveTextColor(null); }}
                                            className={`flex-1 py-1 rounded-lg border underline hover:shadow-sm transition-colors text-slate-700 ${activeFormatter === 'underline' ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-transparent bg-transparent hover:bg-white hover:border-slate-300'}`}
                                            title={I18N[lang]?.brushUnderline}
                                        >{lang === "en" ? "U" : "Ч"}</button>
                                        <button 
                                            onClick={(e) => { e.preventDefault(); setActiveFormatter(prev => prev === 'removeFormat' ? null : 'removeFormat'); setActiveMarkerColor(null); setActiveTextColor(null); }}
                                            className={`flex-1 py-1 rounded-lg border hover:shadow-sm transition-colors text-slate-700 ${activeFormatter === 'removeFormat' ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-transparent bg-transparent hover:bg-white hover:border-slate-300'}`}
                                            title={I18N[lang]?.brushClearFormat}
                                        >T✕</button>
                                    </div>
                                    
                                    <div className="flex flex-col gap-2 rounded-xl border border-slate-200 bg-slate-50 p-2">
                                        <div className="flex bg-slate-200 p-0.5 rounded-lg text-[9px] font-bold">
                                            <button 
                                                onClick={(e) => { e.preventDefault(); setColorTarget('text'); }} 
                                                className={`flex-1 py-1 rounded-md transition-all ${colorTarget === 'text' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}
                                            >{I18N[lang]?.textColor}</button>
                                            <button 
                                                onClick={(e) => { e.preventDefault(); setColorTarget('marker'); }} 
                                                className={`flex-1 py-1 rounded-md transition-all ${colorTarget === 'marker' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}
                                            >{I18N[lang]?.markerHighlight}</button>
                                        </div>
                                        
                                        <div className="flex justify-between items-center px-1">
                                            <div className="text-[10px] font-bold text-slate-500 uppercase">{colorTarget === 'text' ? I18N[lang]?.selectedTextColor : I18N[lang]?.selectedMarkerColor}</div>
                                            <button 
                                                onClick={(e) => { 
                                                    e.preventDefault();
                                                    if (colorTarget === 'text') {
                                                        setActiveTextColor(prev => prev === 'transparent' ? null : 'transparent'); 
                                                        setActiveFormatter(null);
                                                        setActiveMarkerColor(null);
                                                    } else {
                                                        setActiveMarkerColor(prev => prev === 'transparent' ? null : 'transparent'); 
                                                        setActiveFormatter(null);
                                                        setActiveTextColor(null);
                                                    }
                                                }}
                                                className={`w-5 h-5 rounded-full border hover:scale-110 transition-transform shadow-sm flex items-center justify-center relative overflow-hidden ${(colorTarget === 'text' ? activeTextColor : activeMarkerColor) === 'transparent' ? 'ring-2 ring-blue-500 ring-offset-1 border-blue-500' : 'border-slate-300'}`}
                                                style={{ backgroundColor: '#ffffff' }}
                                                title={I18N[lang]?.resetColor}
                                            >
                                                <div className="absolute inset-0" style={{ background: 'repeating-linear-gradient(45deg, transparent, transparent 3px, #ff0000 3px, #ff0000 4px)' }} />
                                            </button>
                                        </div>
                                        <div className="px-1 pb-1">
                                            <ColorScale 
                                                color={colorTarget === 'text' ? (activeTextColor || '#333333') : (activeMarkerColor || '#ffffff')} 
                                                onChange={(val) => { 
                                                    if (colorTarget === 'text') {
                                                        setActiveTextColor(val); 
                                                        setActiveFormatter(null);
                                                        setActiveMarkerColor(null);
                                                    } else {
                                                        setActiveMarkerColor(val); 
                                                        setActiveFormatter(null);
                                                        setActiveTextColor(null);
                                                    }
                                                }} 
                                            />
                                        </div>
                                    </div>
                                    </>
                                    )}
                                    
                                    {fontTab === 'fonts' && (
                                        <div className="flex flex-col gap-2 mt-1">
                                            <div className="flex bg-slate-200 p-0.5 rounded-lg text-[9px] font-bold mx-1">
                                                <button onClick={() => setFontTarget('title')} className={`flex-1 py-1 rounded-md transition-all ${fontTarget === 'title' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.subTabForTitle}</button>
                                                <button onClick={() => setFontTarget('text')} className={`flex-1 py-1 rounded-md transition-all ${fontTarget === 'text' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>{I18N[lang]?.subTabForText}</button>
                                            </div>
                                            <div className="max-h-72 overflow-y-auto custom-scrollbar flex flex-col gap-1 pr-1">
                                                {FONT_OPTIONS.map(f => (
                                                    <button key={f.value} onClick={() => { if(selectedNode) changeNodeProperty(fontTarget === 'title' ? 'titleFontFamily' : 'textFontFamily', f.value); }} className={`w-full text-left px-3 py-2.5 hover:bg-slate-50 rounded-xl text-sm flex justify-between items-center transition-colors ${ (fontTarget === 'title' ? selectedNode?.titleFontFamily : selectedNode?.textFontFamily) === f.value ? 'bg-blue-50 text-blue-600 font-medium ring-1 ring-blue-500' : 'text-slate-700'}`} style={{ fontFamily: f.value }}>
                                                        {f.name} <span className="text-[10px] text-slate-400">Aa</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {openSubPanel === 'fill' && (
                                <div className="flex flex-col gap-2 p-3 bg-white rounded-2xl shadow-2xl border border-slate-200 backdrop-blur-sm bg-white/95 w-64">
                                    <div className="grid grid-cols-6 gap-1.5">
                                        {COLORS.map(c => <button key={c.value} onClick={() => { if(selectedNode) changeNodeProperty('fillColor', c.value); }} className={`w-7 h-7 rounded-full border border-slate-300 hover:scale-110 transition-transform shadow-sm ${(selectedNode && selectedNode.fillColor === c.value) ? 'ring-2 ring-blue-500 ring-offset-1' : ''}`} style={{ backgroundColor: c.value }} title={c.name} />)}
                                    </div>
                                    <ColorScale color={selectedNode?.fillColor} onChange={(val) => { if(selectedNode) changeNodeProperty('fillColor', val); }} lang={lang} />
                                </div>
                            )}

                            {openSubPanel === 'stroke' && (
                                <div className="p-4 bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col gap-3 backdrop-blur-sm bg-white/95 w-64">
                                    <div className="grid grid-cols-6 gap-1.5">
                                        {COLORS.map(c => c.value !== 'transparent' && <button key={c.value} onClick={() => { if(selectedNode) changeNodeProperty('strokeColor', c.value); }} className={`w-7 h-7 rounded-full border border-slate-300 hover:scale-110 transition-transform shadow-sm ${(selectedNode && selectedNode.strokeColor === c.value) ? 'ring-2 ring-blue-500 ring-offset-1' : ''}`} style={{ backgroundColor: c.value }} />)}
                                    </div>
                                    <ColorScale color={selectedNode?.strokeColor} onChange={(val) => { if(selectedNode) changeNodeProperty('strokeColor', val); }} lang={lang} />
                                    <div className="h-px bg-slate-100 my-1" />
                                    <div className="grid grid-cols-5 gap-1">
                                        {THICKNESS_OPTIONS.map(t => <button key={t} onClick={() => { if(selectedNode) changeNodeProperty('strokeWidth', t); }} className={`px-2 py-1.5 text-[10px] font-bold rounded-lg border transition-all ${(selectedNode && selectedNode.strokeWidth === t) ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>{t}px</button>)}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Bottom Panel (Sheets) */}
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-2 p-2 bg-white rounded-2xl shadow-2xl border border-slate-200 backdrop-blur-sm bg-white/90 overflow-x-auto max-w-[90vw] custom-scrollbar">
                        {sheets
                            .filter(s => {
                                if (lang === 'en' && (s.id === 'sheet-guide-ru' || s.id === 'sheet-demo-ru')) return false;
                                if (lang === 'ru' && (s.id === 'sheet-guide-en' || s.id === 'sheet-demo-en')) return false;
                                return true;
                            })
                            .map(s => {
                                const displayName = (s.id === 'sheet-workspace' && (s.name === 'My Project' || s.name === 'Мой проект'))
                                    ? (lang === 'ru' ? 'Мой проект' : 'My Project')
                                    : s.name;
                                const isCurrentActive = activeSheetId === s.id || (lang === 'ru' && activeSheetId === 'sheet-guide-en' && s.id === 'sheet-guide-ru') || (lang === 'en' && activeSheetId === 'sheet-guide-ru' && s.id === 'sheet-guide-en');
                                return (
                                    <div key={s.id} onClick={() => { setActiveSheetId(s.id); setSelectedNodeIds([]); setSelectedEdgeId(null); }} className={`group px-5 py-2.5 rounded-xl text-sm font-bold cursor-pointer transition-all flex items-center gap-3 border whitespace-nowrap ${isCurrentActive ? 'bg-blue-50 text-blue-600 border-blue-200 shadow-sm' : 'text-slate-500 border-transparent hover:bg-slate-100 hover:text-slate-700'}`}>
                                        <FileText size={16}/>
                                        {editingSheetId === s.id ? (
                                            <input autoFocus className="bg-transparent outline-none w-24 border-b-2 border-blue-400 font-bold" defaultValue={displayName} onBlur={(e) => { setSheets(sheets.map(sh => sh.id === s.id ? { ...sh, name: e.target.value || sh.name } : sh)); setEditingSheetId(null); }} onKeyDown={e => e.key === 'Enter' && e.target.blur()} />
                                        ) : (
                                            <span onDoubleClick={(e) => { e.stopPropagation(); setEditingSheetId(s.id); }}>{displayName}</span>
                                        )}
                                        {sheets.length > 1 && (
                                            <button onClick={(e) => deleteSheet(e, s.id)} className="opacity-0 group-hover:opacity-100 p-0.5 hover:bg-rose-100 hover:text-rose-600 rounded transition-all ml-1" title={I18N[lang]?.confirmDeleteSheet}>
                                                <X size={14} />
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        <button onClick={addNewSheet} className="p-2.5 text-blue-600 hover:bg-blue-50 rounded-xl transition-all border border-transparent hover:border-blue-100 flex items-center gap-2 font-bold text-sm ml-2 pr-4" title={I18N[lang]?.addNewSheet || "Add new sheet"}>
                            <Plus size={20} />
                        </button>
                    </div>

                    {zoomNodeId && (
                        <AltZoomModal 
                            node={nodes.find(n => n.id === zoomNodeId)} 
                            isRCMode={isRCMode} 
                            onClose={() => setZoomNodeId(null)}
                            onUpdate={(updates) => {
                                updateActiveSheet({
                                    nodes: nodes.map(n => n.id === zoomNodeId ? { ...n, ...updates } : n)
                                });
                            }}
                            lang={lang}
                        />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
